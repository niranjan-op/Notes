name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native build dependencies
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install sqlcipher:x64-windows openssl:x64-windows
      - name: Build application
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python setup.py build_ext --inplace
          python -m unittest discover -s tests
          python -m PyInstaller --noconfirm --clean NotesApp.spec
          Compress-Archive -Path dist\NotesApp\* -DestinationPath NotesApp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NotesApp-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build application
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python setup.py build_ext --inplace
          python -m unittest discover -s tests
          python -m PyInstaller --noconfirm --clean NotesApp.spec
      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -a dist/NotesApp/. AppDir/usr/bin/
          cp assets/notes.svg AppDir/notes.svg
          printf '[Desktop Entry]\nType=Application\nName=Secure Notes\nExec=NotesApp\nIcon=notes\nCategories=Office;Utility;\n' > AppDir/NotesApp.desktop
          ln -s usr/bin/NotesApp AppDir/AppRun
          curl -L --fail -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir NotesApp-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: NotesApp-linux-x86_64.AppImage

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
